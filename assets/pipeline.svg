<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1b2e"/>
    <stop offset="1" stop-color="#1e3a5f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3333"/>
    <stop offset="1" stop-color="#e10d0d"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="250" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="250" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">From a folder of PDFs and drawings to an answer you can trust</text>
  
  <g transform="translate(20 86)">
    <rect width="196" height="124" rx="18" fill="#fff" fill-opacity="0.06" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="9" fill="url(#accent)">
      <animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" font-size="20" font-weight="800" fill="#fff">Ingest</text>
    <text x="20" y="72" font-size="13.5" fill="#c9d6e8">Crawl, hash, dedupe</text>
    <text x="20" y="94" font-size="13.5" fill="#c9d6e8">S3, SharePoint, folders</text>
  </g>
  <path d="M216 148.0 H260" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#ff3333">
    <animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M216 148.0 H260"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(260 86)">
    <rect width="196" height="124" rx="18" fill="#fff" fill-opacity="0.06" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="9" fill="url(#accent)">
      <animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" font-size="20" font-weight="800" fill="#fff">Parse</text>
    <text x="20" y="72" font-size="13.5" fill="#c9d6e8">OCR for clean text</text>
    <text x="20" y="94" font-size="13.5" fill="#c9d6e8">vision model for drawings</text>
  </g>
  <path d="M456 148.0 H500" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#ff3333">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M456 148.0 H500"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(500 86)">
    <rect width="196" height="124" rx="18" fill="#fff" fill-opacity="0.06" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="9" fill="url(#accent)">
      <animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" font-size="20" font-weight="800" fill="#fff">Index</text>
    <text x="20" y="72" font-size="13.5" fill="#c9d6e8">Postgres + Qdrant</text>
    <text x="20" y="94" font-size="13.5" fill="#c9d6e8">OpenSearch + Neo4j</text>
  </g>
  <path d="M696 148.0 H740" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#ff3333">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M696 148.0 H740"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(740 86)">
    <rect width="196" height="124" rx="18" fill="#fff" fill-opacity="0.06" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="9" fill="url(#accent)">
      <animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" font-size="20" font-weight="800" fill="#fff">Reason</text>
    <text x="20" y="72" font-size="13.5" fill="#c9d6e8">Search, check, search again</text>
    <text x="20" y="94" font-size="13.5" fill="#c9d6e8">LangGraph agent, any model</text>
  </g>
  <path d="M936 148.0 H980" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#ff3333">
    <animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M936 148.0 H980"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(980 86)">
    <rect width="196" height="124" rx="18" fill="#fff" fill-opacity="0.06" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="9" fill="url(#accent)">
      <animate attributeName="r" values="9;11;9" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" font-size="20" font-weight="800" fill="#fff">Deliver</text>
    <text x="20" y="72" font-size="13.5" fill="#c9d6e8">Cited answer, or an action</text>
    <text x="20" y="94" font-size="13.5" fill="#c9d6e8">a person approves first</text>
  </g>
  <text x="600" y="238" text-anchor="middle" font-size="13" fill="#8fa6c4">Every step is idempotent, traced with OpenTelemetry, and runs inside the customer's own cloud account.</text>
</g>
</svg>
