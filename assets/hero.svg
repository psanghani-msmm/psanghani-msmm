<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1b2e"/>
    <stop offset="0.55" stop-color="#142a45"/>
    <stop offset="1" stop-color="#1e3a5f"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#e10d0d" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#e10d0d" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.05"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="28"/></clipPath>
  <clipPath id="markclip"><circle cx="32" cy="32" r="22.5"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle cx="1040" cy="40" r="300" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 30;0 0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- orbit ring, like the logo's -->
  <ellipse cx="600" cy="420" rx="760" ry="150" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3" transform="rotate(-8 600 420)"/>
  
    <rect x="700" y="400" width="26" height="60" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;340" dur="1.2s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="738" y="400" width="26" height="110" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;290" dur="1.2s" begin="0.08s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="776" y="400" width="26" height="80" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;320" dur="1.2s" begin="0.16s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="814" y="400" width="26" height="150" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;250" dur="1.2s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="852" y="400" width="26" height="100" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;300" dur="1.2s" begin="0.32s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="890" y="400" width="26" height="190" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;210" dur="1.2s" begin="0.40s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="928" y="400" width="26" height="160" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;240" dur="1.2s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="966" y="400" width="26" height="120" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;280" dur="1.2s" begin="0.56s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="1004" y="400" width="26" height="90" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;310" dur="1.2s" begin="0.64s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="1042" y="400" width="26" height="140" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;260" dur="1.2s" begin="0.72s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="1080" y="400" width="26" height="70" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;330" dur="1.2s" begin="0.80s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="1118" y="400" width="26" height="110" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;290" dur="1.2s" begin="0.88s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="1156" y="400" width="26" height="50" fill="#fff" fill-opacity="0.07">
      <animate attributeName="y" values="400;350" dur="1.2s" begin="0.96s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

  <!-- character -->
  <g transform="translate(62 83) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.4s" repeatCount="indefinite"/>
      
  <!-- hood ring -->
  <ellipse cx="256" cy="398" rx="78" ry="26" fill="#e10d0d"/>
  <!-- neck -->
  <rect x="226" y="316" width="60" height="78" rx="22" fill="#c98b64"/>
  <!-- body -->
  <path d="M92 512 C92 424 160 384 256 384 C352 384 420 424 420 512 Z" fill="#c40b0b"/>
  <path d="M212 388 L256 446 L300 388" fill="#e10d0d"/>
  <path d="M240 444 v44 M272 444 v44" stroke="#ffd6d6" stroke-width="5" stroke-linecap="round"/>
  
  <!-- waving arm, pivot at the shoulder -->
  <g transform="translate(392 446)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-22;14;-22"
        dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M0 0 L48 -96" stroke="#c40b0b" stroke-width="44" stroke-linecap="round" fill="none"/>
      <path d="M36 -72 L62 -124" stroke="#e8b088" stroke-width="32" stroke-linecap="round" fill="none"/>
      <circle cx="70" cy="-142" r="30" fill="#e8b088"/>
      <path d="M48 -156 q-16 -14 -6 -30" stroke="#e8b088" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M60 -170 v-26 M74 -172 v-30 M88 -166 v-26" stroke="#e8b088" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
  <!-- ears -->
  <circle cx="162" cy="242" r="18" fill="#e8b088"/>
  <circle cx="350" cy="242" r="18" fill="#e8b088"/>
  <!-- head -->
  <ellipse cx="256" cy="232" rx="96" ry="104" fill="#e8b088"/>
  <!-- hair -->
  <path d="M160 236 C154 136 200 100 256 100 C312 100 358 136 352 236 C342 194 322 170 298 168 C272 166 252 178 236 178 C210 178 182 194 160 236 Z" fill="#1f1a1a"/>
  <path d="M226 110 C236 84 266 78 286 90 C268 92 250 100 242 114 Z" fill="#1f1a1a"/>
  <!-- brows -->
  <path d="M194 198 q24 -14 48 -2" stroke="#1f1a1a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M270 196 q24 -12 48 2" stroke="#1f1a1a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="220" cy="232" rx="16" ry="18" fill="#fff"><animate attributeName="ry" values="18;18;1;18" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse><ellipse cx="222" cy="234" rx="8" ry="8" fill="#1a1a1a"><animate attributeName="ry" values="8;8;0.5;8" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse><ellipse cx="226" cy="229" rx="3" ry="3" fill="#fff"><animate attributeName="ry" values="3;3;0.2;3" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="292" cy="232" rx="16" ry="18" fill="#fff"><animate attributeName="ry" values="18;18;1;18" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse><ellipse cx="294" cy="234" rx="8" ry="8" fill="#1a1a1a"><animate attributeName="ry" values="8;8;0.5;8" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse><ellipse cx="298" cy="229" rx="3" ry="3" fill="#fff"><animate attributeName="ry" values="3;3;0.2;3" keyTimes="0;0.92;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
  <!-- glasses -->
  <g fill="#fff" fill-opacity="0.06" stroke="#1a1a1a" stroke-width="5">
    <circle cx="220" cy="232" r="27"/>
    <circle cx="292" cy="232" r="27"/>
  </g>
  <path d="M247 230 h18 M193 228 h-26 M319 228 h26" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <!-- nose and mouth -->
  <path d="M256 242 q-9 18 4 24" stroke="#c98b64" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M226 284 q30 28 60 0" stroke="#9a3b2e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M236 288 q20 14 40 0 z" fill="#fff"/>
  <!-- cheeks -->
  <circle cx="186" cy="266" r="12" fill="#f5a3a3" opacity="0.55"/>
  <circle cx="326" cy="266" r="12" fill="#f5a3a3" opacity="0.55"/>

    </g>
  </g>

  <!-- copy -->
  <text x="430" y="172" font-size="60" font-weight="800" fill="#ffffff">Parixit Sanghani</text>
  <rect x="432" y="190" height="6" rx="3" width="0" fill="#e10d0d">
    <animate attributeName="width" values="0;120" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="432" y="244" font-size="32" font-weight="600" fill="#c9d6e8" letter-spacing="2" opacity="0">AI Developer
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.9s" fill="freeze"/>
  </text>

  <!-- company mark -->
  <g transform="translate(1004 300)"><g transform="scale(0.875)">
      <ellipse cx="32" cy="32" rx="30" ry="8" transform="rotate(28 32 32)" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="32" cy="32" r="24" fill="#e10d0d" stroke="#fff" stroke-width="2.5"/>
      <g clip-path="url(#markclip)"><rect x="13" y="45" width="3" height="16" fill="#fff"/><rect x="16.8" y="39" width="3" height="22" fill="#fff"/><rect x="20.6" y="43" width="3" height="18" fill="#fff"/><rect x="24.4" y="33" width="3" height="28" fill="#fff"/><rect x="28.2" y="40" width="3" height="21" fill="#fff"/><rect x="32" y="24" width="3" height="37" fill="#fff"/><rect x="35.8" y="29" width="3" height="32" fill="#fff"/><rect x="39.6" y="35" width="3" height="26" fill="#fff"/><rect x="43.4" y="40" width="3" height="21" fill="#fff"/><rect x="47.2" y="43" width="3" height="18" fill="#fff"/></g>
      <path d="M 9 25.4 A 30 8 28 0 1 50.4 47.4" fill="none" stroke="#fff" stroke-width="3.5"/>
    </g></g>
  <text x="1072" y="324" font-size="17" font-weight="700" fill="#fff">MSMM</text>
  <text x="1072" y="344" font-size="13" fill="#c9d6e8">Engineering, LLC</text>
</g>
</svg>
